name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (bounded retry, network only)
        run: for i in 1 2 3; do npm ci && exit 0; echo "npm ci failed (attempt $i)"; sleep $((2 ** i * 2)); done; exit 1
      # Browser binary cached per lockfile. OS packages are installed only if Chromium cannot launch:
      # ubuntu-24.04 already ships Chrome's libraries, and the optional font packages pulled by
      # install-deps are what stalled on the apt mirror and timed out whole runs.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for E2E (bounded retry)
        timeout-minutes: 8
        run: for i in 1 2 3; do timeout --kill-after=10s 150 npx playwright install chromium && exit 0; echo "attempt $i failed or timed out"; sleep $((2 ** i * 2)); done; exit 1
      - name: Verify Chromium launches (OS packages only if missing)
        timeout-minutes: 8
        run: node scripts/chromium-ready.mjs || { timeout 360 npx playwright install-deps chromium && node scripts/chromium-ready.mjs; }
      - name: Verification pipeline (lint, types, tests, migrations, builds, E2E + axe + offline, worker, preflight)
        run: node scripts/pipeline.mjs
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - name: Upload pipeline report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-${{ github.sha }}
          path: test-results/
          retention-days: 14
