name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (bounded retry, network only)
        run: for i in 1 2 3; do npm ci && exit 0; echo "npm ci failed (attempt $i)"; sleep $((2 ** i * 2)); done; exit 1
      - name: Install Chromium for E2E (bounded retry)
        run: for i in 1 2 3; do npx playwright install --with-deps chromium && exit 0; sleep $((2 ** i * 2)); done; exit 1
      - name: Verification pipeline (lint, types, tests, migrations, builds, E2E + axe + offline, worker, preflight)
        run: node scripts/pipeline.mjs
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - name: Upload pipeline report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-${{ github.sha }}
          path: test-results/
          retention-days: 14
