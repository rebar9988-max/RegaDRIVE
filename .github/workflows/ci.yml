name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: D1 migrations (local SQLite only)
        run: npm run check:migrations
      - name: Production build
        run: npm run build
      - name: Worker bundle (dry run, no upload)
        run: npm run check:worker
      - name: Production preflight gates
        run: node scripts/preflight.mjs
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: E2E (local Workers runtime, axe accessibility, offline)
        run: npm run test:e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/
          retention-days: 14
