name: Diagnose live version (read-only)
# Read-only verification of production. Never deploys, rolls back or changes Cloudflare state.
on:
  push:
    branches: ["diag/edge-version-probe"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: for i in 1 2 3; do timeout 150 npx playwright install --with-deps chromium && exit 0; sleep 5; done; exit 1
      - name: Live verification of Home, Theory Exam, Progress (mobile, tablet, desktop; 4 languages; axe)
        env:
          EXPECTED_COMMIT: 65926c58ceeeff46d75a7258652e81dc4e5d66ad
        run: node scripts/diag-live-verify.mjs https://www.regaplatform.com
