name: D1 recovery point (read-only)
# Reads the current D1 Time Travel bookmark of regadrive-db (the restore point for "restore to this moment") and
# verifies the schema. Read-only: no migration, no write. Uses the RegaDRIVE Cloudflare secrets of the production environment.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d1-bookmark
  cancel-in-progress: false
jobs:
  bookmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do npm ci && exit 0; sleep $((2 ** i * 2)); done; exit 1
      - name: Identity (must be the RegaDRIVE database)
        run: |
          npx wrangler d1 info regadrive-db | tee /tmp/info.txt
          grep -q "bd9f0f57-3b67-49ab-9597-f8ce9b305c88" /tmp/info.txt
      - name: Time Travel bookmark (recovery point)
        run: npx wrangler d1 time-travel info regadrive-db
      - name: Schema and row counts (read-only)
        run: |
          npx wrangler d1 execute regadrive-db --remote --command "SELECT name FROM sqlite_master WHERE type IN ('table','index') AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY name"
          npx wrangler d1 execute regadrive-db --remote --command "SELECT (SELECT COUNT(*) FROM questions) questions, (SELECT COUNT(*) FROM lessons) lessons, (SELECT COUNT(*) FROM progress) progress, (SELECT COUNT(*) FROM dr_content_reviews) reviews"
