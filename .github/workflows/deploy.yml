name: Deploy to Cloudflare (manual)
# Manual only, main only. Needs RegaDRIVE-only secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID and the
# repository variable REGAPLATFORM_DOMAIN_VERIFIED=true (set by the owner after verifying the domain).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY-REGADRIVE to confirm"
        required: true
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  ci:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY-REGADRIVE'
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: ci   # green CI on this exact SHA is mandatory
    runs-on: ubuntu-latest
    environment: production
    env:
      TARGET_URL: https://www.regaplatform.com
      REGAPLATFORM_DOMAIN_VERIFIED: ${{ vars.REGAPLATFORM_DOMAIN_VERIFIED }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do npm ci && exit 0; sleep $((2 ** i * 2)); done; exit 1
      - run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Preflight (all gates fatal)
        run: node scripts/preflight.mjs --stage=deploy
      - name: Domain safety check (never overwrite an unrelated site)
        run: node scripts/domain-check.mjs "$TARGET_URL"
      - name: Record last known-good version
        id: lkg
        run: |
          npx wrangler deployments list --json > lkg.json 2>/dev/null || echo "[]" > lkg.json
          echo "version=$(node scripts/last-known-good.mjs < lkg.json)" >> "$GITHUB_OUTPUT"
      - name: Deploy
        run: npx wrangler deploy --tag "${GITHUB_SHA::12}" --message "RegaDRIVE ${GITHUB_SHA::12}"
      - name: Live smoke test
        id: smoke
        run: sleep 20 && node scripts/smoke.mjs "$TARGET_URL"
      - name: Automatic rollback to last known-good
        if: failure() && steps.smoke.outcome == 'failure' && steps.lkg.outputs.version != ''
        run: |
          npx wrangler rollback "${{ steps.lkg.outputs.version }}" -y -m "Auto-rollback: smoke test failed for ${GITHUB_SHA::12}"
          sleep 20 && node scripts/smoke.mjs "$TARGET_URL" || echo "::error::Rollback smoke test failed — owner action required"
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-evidence-${{ github.sha }}
          path: |
            test-results/
            lkg.json
