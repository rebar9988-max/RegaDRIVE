name: Deploy to Cloudflare
# Main only. Needs RegaDRIVE-only secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.
# Owner rule (2026-11-12): only the newest successful version is published on www.regaplatform.com.
#  - automatic: after CI succeeds on a push to main, for that commit only if it is still the newest main;
#  - manual: workflow_dispatch with DEPLOY-REGADRIVE (runs CI again on the exact commit first).
# An older commit is never released: every path checks "newest main" again right before the upload.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY-REGADRIVE to confirm"
        required: true
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  # Release gate, before any CI minutes are spent: only the newest main, and never the commit already live.
  guard:
    # Automatic path: a successful CI run of a push to main in this repository, and only for the commit that is
    # main right now (the run's commit equals the checked-out newest main). A newer push gets its own CI and run.
    if: >-
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY-REGADRIVE') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.live.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - name: Only the newest main may be released
        run: node scripts/check-current-release.mjs
      - name: Never republish the commit production already serves
        id: live
        run: node scripts/check-not-already-live.mjs https://www.regaplatform.com
  # Manual path only: the automatic path starts from a green CI run on this exact commit (checked in guard).
  ci:
    needs: guard
    if: needs.guard.outputs.deploy == 'true' && github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: [guard, ci]   # green CI on this exact SHA is mandatory
    if: >-
      !cancelled() && needs.guard.result == 'success' && needs.guard.outputs.deploy == 'true' &&
      (needs.ci.result == 'success' || (github.event_name == 'workflow_run' && needs.ci.result == 'skipped'))
    runs-on: ubuntu-24.04
    environment: production
    env:
      TARGET_URL: https://www.regaplatform.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    timeout-minutes: 30
    steps:
      - name: Require RegaDRIVE Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN (RegaDRIVE-only token)"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - uses: actions/checkout@v4
      - name: Reject superseded deployment runs
        timeout-minutes: 1
        run: node scripts/check-current-release.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (bounded retry)
        timeout-minutes: 5
        run: for i in 1 2 3; do npm ci && exit 0; sleep $((2 ** i * 2)); done; exit 1
      - name: Install Chromium for the live smoke test
        timeout-minutes: 8
        run: for i in 1 2 3; do timeout --kill-after=10s 150 npx playwright install chromium && exit 0; echo "attempt $i failed or timed out"; sleep $((2 ** i * 2)); done; exit 1
      # OS packages only if Chromium cannot launch (the runner already ships Chrome's libraries; the apt
      # mirror stalls on optional fonts). Runs before the upload, so a broken browser never blocks a rollback.
      - name: Verify Chromium launches (OS packages only if missing)
        timeout-minutes: 8
        run: node scripts/chromium-ready.mjs || { timeout 360 npx playwright install-deps chromium && node scripts/chromium-ready.mjs; }
      - name: Production build
        timeout-minutes: 5
        run: npm run build
      - name: Preflight (all gates fatal)
        timeout-minutes: 2
        run: node scripts/preflight.mjs --stage=deploy
      - name: Domain safety check (never overwrite an unrelated site)
        timeout-minutes: 2
        run: node scripts/domain-check.mjs "$TARGET_URL"
      - name: Record last known-good version
        timeout-minutes: 3
        id: lkg
        run: |
          npx wrangler deployments list --json > lkg.json 2>/dev/null || echo "[]" > lkg.json
          echo "version=$(node scripts/last-known-good.mjs < lkg.json)" >> "$GITHUB_OUTPUT"
      - name: Recheck main immediately before upload
        timeout-minutes: 1
        run: node scripts/check-current-release.mjs
      - name: Recheck production does not already serve this commit
        timeout-minutes: 1
        id: fresh
        run: node scripts/check-not-already-live.mjs "$TARGET_URL"
      - name: Deploy
        if: steps.fresh.outputs.deploy == 'true'
        timeout-minutes: 5
        run: npx wrangler deploy --tag "${GITHUB_SHA::12}" --message "RegaDRIVE ${GITHUB_SHA::12}"
      - name: Live smoke test (exact build ID and commit of this run)
        if: steps.fresh.outputs.deploy == 'true'
        timeout-minutes: 5
        id: smoke
        run: |
          sleep 20
          export EXPECTED_BUILD_ID="$(node -p "require('./dist/build-info.json').buildId")"
          export EXPECTED_COMMIT="$(node -p "require('./dist/build-info.json').commit")"
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA" || { echo "::error::built commit $EXPECTED_COMMIT != $GITHUB_SHA"; exit 1; }
          node scripts/smoke.mjs "$TARGET_URL"
          echo "### Live release verified" >> "$GITHUB_STEP_SUMMARY"
          echo "$TARGET_URL serves build \`$EXPECTED_BUILD_ID\` from commit \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Automatic rollback to last known-good
        if: failure() && steps.smoke.outcome == 'failure' && steps.lkg.outputs.version != ''
        run: |
          npx wrangler rollback "${{ steps.lkg.outputs.version }}" -y -m "Auto-rollback: smoke test failed for ${GITHUB_SHA::12}"
          # The previous version may be an older app, so only verify that the site answers again.
          sleep 20
          code=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL/")
          echo "Rolled back to ${{ steps.lkg.outputs.version }}; $TARGET_URL/ answers HTTP $code"
          test "$code" -lt 500 || echo "::error::Site not healthy after rollback (HTTP $code) — owner action required"
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-evidence-${{ github.sha }}
          path: |
            test-results/
            lkg.json
