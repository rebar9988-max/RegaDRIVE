name: Deploy to Cloudflare (manual)
# Manual only. Requires repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (RegaDRIVE-only token).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY-REGADRIVE to confirm"
        required: true
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY-REGADRIVE'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run check:migrations
      - run: npm run build
      - name: Production preflight (fail closed)
        env:
          REGAPLATFORM_DOMAIN_VERIFIED: ${{ vars.REGAPLATFORM_DOMAIN_VERIFIED }}
        run: node scripts/preflight.mjs
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --tag "${GITHUB_SHA::12}"
