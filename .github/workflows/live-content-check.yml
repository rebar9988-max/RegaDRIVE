name: Live content check (read-only)
# Reliable production check from GitHub's network (the sandbox that builds this code cannot reach the domain).
# Read-only: no secrets, no writes. Runs after every deployment and on demand; prints which network layer fails.
on:
  workflow_dispatch:
    inputs:
      expect_commit:
        description: "Commit SHA production should serve (optional)"
        required: false
  workflow_run:
    workflows: ["Deploy to Cloudflare"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: live-content-check
  cancel-in-progress: false
jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Live content check
        env:
          EXPECT: ${{ inputs.expect_commit || github.event.workflow_run.head_sha }}
        run: node scripts/live-content-check.mjs https://www.regaplatform.com ${EXPECT:+--expect-commit=$EXPECT}
