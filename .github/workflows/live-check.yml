name: Live account check (read-only)
# Tests the deployed student account page and its server-side safeguards on www.regaplatform.com.
# Read-only: no secrets, no account, no writes. Runs after every successful deployment and on demand.
on:
  workflow_dispatch:
    inputs:
      expect_commit:
        description: "Commit SHA production should serve (optional)"
        required: false
  workflow_run:
    workflows: ["Deploy to Cloudflare (manual)"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: live-check
  cancel-in-progress: false
jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (bounded retry)
        timeout-minutes: 5
        run: for i in 1 2 3; do npm ci && exit 0; sleep $((2 ** i * 2)); done; exit 1
      - name: Install Chromium
        timeout-minutes: 8
        run: for i in 1 2 3; do timeout --kill-after=10s 150 npx playwright install chromium && exit 0; sleep $((2 ** i * 2)); done; exit 1
      - name: Verify Chromium launches (OS packages only if missing)
        timeout-minutes: 8
        run: node scripts/chromium-ready.mjs || { timeout 360 npx playwright install-deps chromium && node scripts/chromium-ready.mjs; }
      - name: Live account check
        env:
          EXPECT: ${{ inputs.expect_commit || github.event.workflow_run.head_sha }}
        run: node scripts/live-account-check.mjs https://www.regaplatform.com ${EXPECT:+--expect-commit=$EXPECT}
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-account-${{ github.run_id }}
          path: test-results/
